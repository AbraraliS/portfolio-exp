<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#dc2626" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g fill="none" stroke="url(#redGlow)" filter="url(#neon)">
    <!-- Letter A -->
    <path d="M 165 120 L 75 280 M 165 120 L 215 280 M 120 200 L 190 200" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Letter S -->
    <path d="M 345 120 L 275 120 L 265 200 L 335 200 L 325 280 L 255 280" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Developer Brackets -->
    <path d="M 45 120 L 20 120 L 20 280 L 45 280" stroke-width="8" stroke-linecap="square" stroke-opacity="0.7"/>
    <path d="M 355 120 L 380 120 L 380 280 L 355 280" stroke-width="8" stroke-linecap="square" stroke-opacity="0.7"/>
    <!-- Tech Accent Nodes -->
    <circle cx="20" cy="120" r="5" fill="#ef4444" stroke="none"/>
    <circle cx="20" cy="280" r="5" fill="#ef4444" stroke="none"/>
    <circle cx="380" cy="120" r="5" fill="#ef4444" stroke="none"/>
    <circle cx="380" cy="280" r="5" fill="#ef4444" stroke="none"/>
    <!-- Circuit / connection accent inside the logo -->
    <path d="M 190 200 L 265 200" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="4 4" stroke-linecap="round"/>
  </g>
</svg>
